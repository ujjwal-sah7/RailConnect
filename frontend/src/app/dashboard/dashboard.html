<div class="dashboard-container">

  <nav class="navbar">
    <div class="logo">
      RailConnect
    </div>

    <button class="logout-btn" (click)="logout()">
      Logout
    </button>
  </nav>

  <main class="dashboard-content">

    <div class="welcome-card">
      <h1>Welcome to RailConnect 🚆</h1>
      <p>You are successfully logged in.</p>

      <div class="feature-grid">

        <!-- Search Trains -->
        <div
          class="feature-card"
          (click)="router.navigate(['/trains/search'])"
        >
          <h2>🔎 Search Trains</h2>
          <p>Find trains between your source and destination.</p>
        </div>

        <!-- Book Ticket -->
        <div
          class="feature-card"
          (click)="router.navigate(['/trains/search'])"
        >
          <h2>🎫 Book Ticket</h2>
          <p>Book your railway ticket easily.</p>
        </div>

        <!-- My Bookings -->
        <div
          class="feature-card"
          (click)="router.navigate(['/user/my-bookings'])"
        >
          <h2>📋 My Bookings</h2>
          <p>View and manage your bookings.</p>
        </div>

        <!-- Account -->
        <div
          class="feature-card"
          (click)="router.navigate(['/user/profile'])"
        >
          <h2>🔐 Account</h2>
          <p>Your account is securely authenticated.</p>
        </div>

      </div>
    </div>

  </main>

</div>
